services:
  postgres:
    image: postgres:16-alpine
    container_name: fisrtname-postgres
    environment:
      POSTGRES_DB: fisrtname
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fisrtname']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fisrtname-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-12h}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      REFRESH_TOKEN_COOKIE_NAME: ${REFRESH_TOKEN_COOKIE_NAME:-fisrtname_rt}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/fisrtname?schema=public
      UPLOAD_DIR: /app/uploads
      SERVE_PUBLIC_UPLOADS: ${SERVE_PUBLIC_UPLOADS:-false}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      LOGIN_THROTTLE_LIMIT: ${LOGIN_THROTTLE_LIMIT:-5}
      LOGIN_THROTTLE_TTL_MS: ${LOGIN_THROTTLE_TTL_MS:-60000}
      GLOBAL_THROTTLE_LIMIT: ${GLOBAL_THROTTLE_LIMIT:-120}
      GLOBAL_THROTTLE_TTL_MS: ${GLOBAL_THROTTLE_TTL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    ports:
      - '127.0.0.1:3001:3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
    container_name: fisrtname-web
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'

  nginx:
    image: nginx:1.27-alpine
    container_name: fisrtname-nginx
    depends_on:
      - web
      - api
    ports:
      - '80:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
